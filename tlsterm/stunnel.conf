; Legacy-TLS terminator: accept SSLv3/RC4 from the game, forward plaintext FESL
; to coopserver (which captures it and replies; stunnel re-encrypts the reply).
foreground = yes
debug = 7
output = /dev/stderr
syslog = no

cert = /certs/server.pem
; Force SSLv3 + the exact ciphers the game offers (RC4-SHA / RC4-MD5).
sslVersion = SSLv3
options = -NO_SSLv3
ciphers = RC4-SHA:RC4-MD5

[fesl-18710]
accept = 0.0.0.0:18710
connect = coopserver:18710
