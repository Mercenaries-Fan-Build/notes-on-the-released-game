# engine_trace_asi profile example
# Keys are case-insensitive for probe aliases but kept lowercase here.

# MixSources entry probe (required for first capture pass)
probe.mixsources_entry.address=0x00836610
probe.mixsources_entry.snapshot=true

# MixSources callsite / exit-adjacent probe (required for first capture pass)
probe.mixsources_exit.address=0x0083664C
probe.mixsources_exit.snapshot=true

# Optional: audio object free probe (set address/RVA when verified)
probe.audio_object_free.address=0x00000000
probe.audio_object_free.snapshot=true

# Optional: mixer loop family
probe.audio.mixer_thread.loop.address=0x00831EE0
probe.audio.mixer_thread.loop.snapshot=false
