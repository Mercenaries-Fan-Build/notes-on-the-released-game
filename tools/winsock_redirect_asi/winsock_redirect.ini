; winsock_redirect.asi configuration — copy alongside the .asi in <game>/scripts/
[redirect]
; IP of the machine running Modkit's coopserver. EA hostnames resolve here and
; public-IP connections are rewritten here (destination port is preserved).
modkit_ip=127.0.0.1

; Set to 1 to ALSO redirect LAN/private (10.x / 192.168.x / 172.16-31.x) and
; loopback destinations. Leave 0 to redirect only public-internet targets
; (the EA servers) and leave local/LAN traffic untouched.
redirect_private=0

[cert]
; EA's genuine FESL cert (served by Modkit's tlsterm) expired 2024-10-25, so the
; game's OpenSSL rejects it as expired. Hooking the CRT _time64 to a date inside
; the cert window makes it validate. 1 = enabled.
faketime_enabled=1
; Epoch seconds to report. 0 = built-in default (1590969600 = 2020-06-01 UTC).
; Must be between the cert's notBefore (2008-12-15) and notAfter (2024-10-25).
faketime_epoch=0
