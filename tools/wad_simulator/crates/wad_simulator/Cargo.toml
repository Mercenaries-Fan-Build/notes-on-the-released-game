[package]
name = "wad_simulator"
version = "1.0.0"
edition = "2021"
description = "Engine-accurate WAD consumption simulator for Mercenaries 2"
license = "MIT"
repository = "https://github.com/Mercenaries-Fan-Build/notes-on-the-released-game"
keywords = ["mercenaries", "wad", "simulation", "game", "engine"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "wad_simulator"
path = "src/main.rs"

[dependencies]
mercs2_formats = { version = "1.0", path = "../mercs2_formats" }
flate2 = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
