[package]
name = "loadprobe"
version = "1.0.0"
edition = "2021"
description = "World-load progress + forensic analyzer for pmc_blackbox.log (Mercenaries 2 PC)"
license = "MIT"
repository = "https://github.com/Mercenaries-Fan-Build/notes-on-the-released-game"
keywords = ["mercenaries", "log-analysis", "game-debugging", "forensics"]
categories = ["command-line-utilities", "development-tools::debugging"]

[lib]
name = "loadprobe"
path = "src/main.rs"

[[bin]]
name = "loadprobe"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = { version = "2.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
